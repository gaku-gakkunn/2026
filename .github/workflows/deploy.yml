name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ] # メインブランチが master の場合は master に書き換えてください

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # 1. 確実にリポジトリのファイルをすべて取得します
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 確実に「リポジトリの直下」にある index.html を狙い撃ちします
      - name: Inject API Key
        run: |
          cd ${{ github.workspace }}
          sed -i 's/__NASA_API_KEY__/${{ secrets.NASA_API_KEY }}/g' index.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      # 3. アップロードする場所も直下に固定します
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
