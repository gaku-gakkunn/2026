name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ] # メインブランチ名が master の場合は master に書き換えてください

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Inject API Key
        run: |
          # 🎯 シングルクォーテーションで囲まれた __NASA_API_KEY__ を本物のキーに確実に置き換えます
          find . -name "*.html" -type f -exec sed -i "s/'__NASA_API_KEY__'/'${{ secrets.NASA_API_KEY }}'/g" {} +

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
