name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ] # メインブランチが master の場合は master に書き換えてください

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 💡 フォルダの場所や大文字小文字（index.html / Index.html）に関わらず、
      # 見つかったすべてのHTMLファイルの中身を力づくで書き換える命令に変えました！
      - name: Inject API Key
        run: |
          find . -name "*.html" -type f -exec sed -i 's/__NASA_API_KEY__/${{ secrets.NASA_API_KEY }}/g' {} +

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
