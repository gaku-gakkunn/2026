    <body>

        <div id="News">
        <div class="date">
            <!-- <h3 id="date">日付の選択</h3> -->

            <input type="button" class="button" value="今日のニュース" onclick="getNews('today')">
            <input type="button" class="button" value="昨日のニュース" onclick="getNews('yesterday')">

        <script>
            // const nasaApiKey = '__NASA_API_KEY__';
            // const api_key = `https://api.nasa.gov/planetary/apod?api_key=${nasaApiKey}`;
            const newUrl = 'https://science.nasa.gov/wp-json/wp/v2/apod-basic';
            const earthUrl = 'https://epic.gsfc.nasa.gov/api/natural';
            async function getNews(date) {
            const News = document.getElementById('News');
            News.innerHTML = `<div class="date">
            <!-- <h3 id="date">日付の選択</h3> -->
            <!-- <input type="date" id="date" onchange="getNews()"> -->
            <input type="button" class="button" value="今日のニュース" onclick="getNews('today')">
            <input type="button" class="button" value="昨日のニュース" onclick="getNews('yesterday')">
            <input type="button" class="button" value="ランダムな日付のニュース" onclick="getNews('random')">
        </div>
        <div class="flex">
        <main id="news1" class = "news">
            <p class="wait">お待ちください...間も無く表示されます</p>
            <div class="reload"></div>
        </main>
        <main class = 'news1' id="news2">
            <p class="wait">お待ちください...間も無く表示されます</p>
            <div class="reload"></div>
        </main>
        </div>`
            const newswait = document.getElementById('news1');
            newswait.innerHTML=`<p class='wait'>お待ちください...間も無く表示されます</p>
            <div class="reload"></div>
            `;
            const newswait2 = document.getElementById('news2');
            newswait2.innerHTML=`<p class='wait'>お待ちください...間も無く表示されます</p>
            <div class="reload"></div>
            `;
            let newsDate = '';
            let getdate = document.getElementById('button');
            if (date == 'today') {
                newsDate = 0;
                api = newUrl
            }else if (date == 'yesterday') {
                newsDate = 1;
                api = newUrl
            }else if (date == 'random') {
                newsDate = Math.floor(Math.random() * 25);
                api = newUrl
            }
                
            try {
                const response = await fetch(api,{mode:'cors'});
                const Data = await response.json();
                console.log(newsDate);
                const data = Data[newsDate];
                console.log(data);
                const day = data.date;
                // console.log(day);
                const JSText = await google(data.explanation);
                const JSTitle = await google(data.title);
                const datanews = data.explanation;
                const datatitle = data.title;
                let imageGetUrl = '';
                let imageUrl = null;
                if (data.copyright !== 'NASA'){
                    let cleanWord = data.title.replace(/[^a-zA-Z0-9]/g, " ");
                    let titleSplit = cleanWord.trim().split(/ +/);
                    const stopWords = [
                    "a", "above", "across", "against", "along", "amazing", "amazingly", "an", "and", "around", "at", "awesome",
                    "beautiful", "beautifully", "behind", "beside", "between", "beyond", "bright", "brightly", "but", "by",
                    "captured", "capturing", "cosmic", "cosmical", "dark", "deep", "deeply", "distant", "faint", "faintly",
                    "featured", "featuring", "flying", "for", "from", "grand", "great", "greatly", "heading", "high", "highly",
                    "image", "images", "in", "inside", "into", "look", "looked", "looking", "looks", "merged", "merging",
                    "mosaic", "mosaics", "mostly", "near", "nearby", "next", "night", "nightsky", "of", "on", "or", "orbited",
                    "orbiting", "outside", "over", "panorama", "panoramas", "partially", "photo", "photograph", "photographs", "photos",
                    "picture", "pictures", "portrait", "portraits", "rising", "scene", "scenes", "setting", "shot", "shots",
                    "show", "showed", "showing", "shows", "sky", "spectacular", "spectacularly", "spied", "the", "through", "to",
                    "totally", "tracked", "tracking", "under", "view", "views", "with", "within", "without"
                    ];
                    let wordList = titleSplit.filter(word => !stopWords.includes(word.toLowerCase()));
                    let searchWords = [];
                    for (let i = 0; i < wordList.length; i++) {
                        if (wordList[i].toUpperCase() == 'NGC' && /^\d+$/.test(wordList[i + 1])) {
                            searchWords.push(`${wordList[i]} ${wordList[i + 1]}`);
                            i++;
                        }else{
                            searchWords.push(wordList[i]);
                        }
                    }
                    const searches = [];
                    for (const count of [5,4,3,2,1]){
                        if (searchWords.length >= count){
                            const words = searchWords.slice(0,count).join(' ');
                            if (!searches.includes(words)){
                                searches.push(words);
                            }
                        }
                    }
                    for (const word of searches){
                        imageGetUrl= 'https://images-api.nasa.gov/search?q='+ encodeURIComponent(word) +'&media_type=image' ;
                        const response = await fetch(imageGetUrl);
                        if (!response.ok){
                            continue;
                        }
                        const searchData = await response.json();
                        imageUrl = searchData.collection?.items?.[0]?.links?.[0]?.href;
                        if (imageUrl){
                            break;
                        }

                    }

                }else{
                    imageUrl= data.hdurl;
                }
                DisplayNews(data,2,datatitle,datanews,imageUrl);
                DisplayNews(data,1,JSTitle,JSText,imageUrl);
                return JSText;
            } catch (error){
                const reload = confirm('通信に失敗しました。リロードしますか？');
                if (reload){
                    location.reload();
                }
            }
        }
        async function DisplayNews(data,kaisu,title,explanation,url){
            const newsbox = document.getElementById('news'+kaisu);
            if (data.copyright == 'NASA') {
            newsbox.innerHTML=`
            <h2>${title}</h2>
            ${
            data.media_type === 'image' 
            ? `<img src="${data.hdurl}" alt="${data.title}">` 
            : data.media_type === 'video' 
            ? `<iframe src="${data.hdurl}" frameborder="0" allowfullscreen class="video-player"></iframe>` 
            : '<p>未対応のメディア形式です。</p>'
            }
            <p>${explanation}</p>
            `;

            } else {
                if (!url) {
                    console.log('画像が見つかりませんでした。');
                    newsbox.innerHTML=`
                    <h2>${title}</h2>
                    <p>画像が見つかりませんでした</p>
                    <p>${explanation}</p>
                    `; 
                    console.log('著作権あり')
                    return;
                }else{
                newsbox.innerHTML=`
                <h2>${title}</h2>
                <img src="${url}" alt="イメージ画像">
                <p>▲image</p>
                <p>${explanation}</p>
                `; 
            }
            }
        }
        async function google(englishtext){
            const googleurl = 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ja&dt=t&q=' + encodeURIComponent(englishtext);
            try{
                const response = await fetch(`${googleurl}`);
                if (!response.ok){
                    throw new Error(`翻訳エラー status: ${response.status}`);
                }
                const data1 = await response.json();
                let translatedText = "";
                data1[0].forEach(element => {
            if (element && element[0]) {
                translatedText += element[0];
            }
        });
                return translatedText;
            }catch(error){
                console.error('翻訳エラー発生:', error);
        return englishtext; 
            }
        };
        async function earthImage() {
            const News = document.getElementById('News');
            News.innerHTML = `
                <main class="earthBox">
                    <p class="wait">お待ちください...間も無く表示されます</p>
                    <div class="reload"></div>
                </main>`
            const response = await fetch(earthUrl);
            if (!response.ok) {
                News.innerHTML = `
                    <p class="wait">画像の入手に失敗しました。</p>`
                    retrun()
            } else {
                const data = await response.json();
                console.log(data)
                const imageUrls = []
                for (let i = 0; i < 10 && i < data.length; i++) {
                    const image = data[i];
                    console.log(image)
                    const year = image.identifier.slice(0,4);
                    const month = image.identifier.slice(4,6);
                    const day = image.identifier.slice(6,8);
                    const imageUrl = `https://epic.gsfc.nasa.gov/archive/natural/${year}/${month}/${day}/`
                    imageUrls.push(imageUrl);
                }
                console.log(imageUrls)
            }
        }
        const script = document.getElementsByTagName('script');
        const currentScript = document.currentScript;
            getNews('today')

        </script>
